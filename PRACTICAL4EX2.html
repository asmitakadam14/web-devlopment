<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>

    <script>

        function validateForm() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let course = document.getElementById("course").value;

            if (name == "") {
                alert("Please enter your name");
                return false;
            }

            if (email == "") {
                alert("Please enter your email");
                return false;
            }

            if (!email.includes("@")) {
                alert("Please enter a valid email");
                return false;
            }

            if (phone == "") {
                alert("Please enter your phone number");
                return false;
            }

            if (phone.length != 10) {
                alert("Phone number must contain 10 digits");
                return false;
            }

            if (course == "") {
                alert("Please select a course");
                return false;
            }

            alert("Registration Successful!");

            return true;
        }


        function clickButton() {
            alert("Register button clicked!");
        }


        function mouseOver() {
            document.getElementById("btn").style.backgroundColor = "lightblue";
        }


        function mouseOut() {
            document.getElementById("btn").style.backgroundColor = "";
        }


        function showName() {
            let name = document.getElementById("name").value;

            if (name != "") {
                document.getElementById("welcome").innerHTML =
                    "Hello " + name + "!";
            }
        }

    </script>
</head>


<body>

    <h1>Student Registration Form</h1>

    <form onsubmit="return validateForm()">

        <h2>Personal Details</h2>

        <label>Name:</label>
        <input type="text"
               id="name"
               placeholder="Enter your name"
               oninput="showName()">

        <br><br>


        <label>Age:</label>
        <input type="number"
               id="age"
               placeholder="Enter your age">

        <br><br>


        <label>Gender:</label>

        <input type="radio" name="gender" value="Male">
        <label>Male</label>

        <input type="radio" name="gender" value="Female">
        <label>Female</label>

        <br><br>


        <h2>Contact Details</h2>

        <label>Email:</label>
        <input type="text"
               id="email"
               placeholder="Enter your email">

        <br><br>


        <label>Phone:</label>
        <input type="text"
               id="phone"
               placeholder="Enter 10-digit phone number">

        <br><br>


        <label>City:</label>
        <input type="text"
               id="city"
               placeholder="Enter your city">

        <br><br>


        <h2>Course Details</h2>

        <label>Select Course:</label>

        <select id="course">

            <option value="">-- Select Course --</option>
            <option value="BCA">computer Enginnering</option>
            <option value="BBA">Mechanical Enginnering</option >
            <option value="BSc">Electrical Enginnering</option>
            <option value="MCA">ai&ml Enginnering</option>

        </select>

        <br><br>


        <label>Hobbies:</label>

        <input type="checkbox" value="Reading">
        <label>Reading</label>

        <input type="checkbox" value="Sports">
        <label>Sports</label>

        <input type="checkbox" value="Music">
        <label>Music</label>

        <br><br>


        <div id="welcome"></div>

        <br>


        <button type="submit"
                id="btn"
                onclick="clickButton()"
                onmouseover="mouseOver()"
                onmouseout="mouseOut()">

            Register

        </button>


        <button type="reset">
            Clear
        </button>

    </form>

</body>

</html>
