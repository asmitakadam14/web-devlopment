
<!DOCTYPE html>
<html>
<head>
    <title>CSS Effects</title>

    <style>
        
        body {
            background: linear-gradient(to right, lightblue, pink);
            text-align: center;
            font-family: Arial;
        }

        
        h1 {
            color: darkblue;
            text-decoration: underline;
        }

        
        p {
            color: purple;
            font-size: 20px;
            text-align: center;
        }

        
        img {
            width: 200px;
            border-radius: 10px;
        }

        
        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            transition: 0.5s;
        }


    </style>
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <p>This is a simple CSS effects webpage.</p>

    <img src="image.jpg" alt="My Image">

    <br><br>

    <button>Click Me</button>

    

</body>
</html>
